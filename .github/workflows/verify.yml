name: Verify fonts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Check fonts, shaping, website, and reproducible build
        run: python verify.py --rebuild
